name: Publish Pacman Package

on:
  repository_dispatch:
    types: [publish-pacman-package]

permissions:
  contents: read

concurrency:
  group: voidctx-r2-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
      PKGNAME: ${{ github.event.client_payload.name }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

      GPG_PASSPHRASE: ${{ secrets.PACMAN_GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ vars.PACMAN_GPG_KEY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate request and load package description
        shell: bash
        run: |
          set -euo pipefail

          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Invalid source repository"
            exit 1
          }

          [[ "$PKGNAME" =~ ^[a-z0-9][a-z0-9@._+-]*$ ]] || {
            echo "::error::Invalid package name"
            exit 1
          }

          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.0)$ ]] || {
            echo "::error::Only stable vX.Y.0 releases are accepted"
            exit 1
          }

          echo "PKGVER=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import json
          import os
          import sys

          name = os.environ["PKGNAME"]

          with open("meta.json", encoding="utf-8") as f:
              catalog = json.load(f)

          matches = [p for p in catalog if p.get("name") == name]

          if len(matches) != 1:
              sys.exit(f"Expected exactly one meta.json entry for {name}")

          desc = matches[0].get("desc", "").strip()

          if not desc or "\n" in desc or "\r" in desc or "\0" in desc:
              sys.exit(f"Invalid or missing description for {name}")

          with open(
              os.environ["RUNNER_TEMP"] + "/package-desc", "w",
              encoding="utf-8"
          ) as f:
              f.write(desc)
          PY

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl zstd gnupg unzip python3
          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" \
            -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/aws/install" \
            --update
          aws --version

      - name: Decrypt and import signing key
        shell: bash
        run: |
          set -euo pipefail

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

          # privkey.asc.gpg is symmetrically encrypted with gpg -c.
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output "$RUNNER_TEMP/privkey.asc" \
            --decrypt "$GITHUB_WORKSPACE/privkey.asc.gpg"

          # The decrypted export contains the unencrypted private key.
          gpg --batch --import "$RUNNER_TEMP/privkey.asc"

          # Remove the temporary plaintext export.
          rm -f "$RUNNER_TEMP/privkey.asc"

          # Ensure the expected signing key was imported.
          gpg --batch --list-secret-keys "$GPG_KEY_ID"

      - name: Download release assets and verify checksums
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/package-work"
          mkdir -p "$WORK"
          cd "$WORK"

          API="https://api.github.com/repos/$SOURCE_REPO/releases/tags/$RELEASE_TAG"

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            "$API" \
            -o release.json

          python3 - <<'PY'
          import json
          import os
          import sys

          name = os.environ["PKGNAME"]

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          if release.get("draft") or release.get("prerelease"):
              sys.exit("Refusing to package a draft or prerelease")

          assets = release.get("assets", [])
          binaries = []
          configs = []

          for asset in assets:
              filename = asset["name"]

              if filename == f"{name}-linux-x86_64":
                  binaries.append(asset)

              elif (
                  filename.startswith(name + "-")
                  and filename.endswith("-linux-x86_64")
                  and len(filename) > len(name + "-linux-x86_64")
              ):
                  binaries.append(asset)

              elif (
                  filename.startswith(name + ".")
                  and filename.endswith(".default")
                  and len(filename) > len(name + ".default")
              ):
                  configs.append(asset)

          if len(binaries) != 1:
              sys.exit(
                  "Expected exactly one matching x86_64 executable; found: "
                  + repr([a["name"] for a in binaries])
              )

          selected = binaries + configs

          if len({a["name"] for a in selected}) != len(selected):
              sys.exit("Duplicate asset names")

          checksums = [
              a for a in assets if a["name"] == "SHA256SUMS"
          ]

          if len(checksums) != 1:
              sys.exit("Release must contain exactly one SHA256SUMS asset")

          with open("assets.tsv", "w", encoding="utf-8") as f:
              for asset in selected:
                  print(
                      asset["name"] + "\t" + asset["browser_download_url"],
                      file=f
                  )

          with open("checksums-url", "w", encoding="utf-8") as f:
              f.write(checksums[0]["browser_download_url"])
          PY

          while IFS=$'\t' read -r filename url; do
            echo "Downloading $filename"
            curl -fsSL "$url" -o "$filename"
          done < assets.tsv

          curl -fsSL "$(cat checksums-url)" -o SHA256SUMS

          python3 - <<'PY'
          import hashlib
          import os
          import re
          import sys

          assets = []

          with open("assets.tsv", encoding="utf-8") as f:
              for line in f:
                  assets.append(line.rstrip("\n").split("\t", 1)[0])

          sums = {}

          with open("SHA256SUMS", encoding="utf-8") as f:
              for line in f:
                  m = re.match(
                      r"^([0-9a-fA-F]{64})\s+[* ]?(.+?)\s*$",
                      line
                  )
                  if m:
                      sums[os.path.basename(m.group(2))] = (
                          m.group(1).lower()
                      )

          for filename in assets:
              if filename not in sums:
                  sys.exit(f"{filename} is missing from SHA256SUMS")

              h = hashlib.sha256()
              with open(filename, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)

              if h.hexdigest() != sums[filename]:
                  sys.exit(f"SHA256 mismatch: {filename}")

              print(f"Verified {filename}")
          PY

      - name: Build package archive
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/package-work"
          ROOT="$WORK/pkgroot"

          mkdir -p "$ROOT/usr/bin" "$ROOT/etc/$PKGNAME"

          while IFS=$'\t' read -r filename url; do
            if [[ "$filename" == "$PKGNAME-linux-x86_64" ]]; then
              install -m 0755 "$WORK/$filename" \
                "$ROOT/usr/bin/$PKGNAME"

            elif [[ "$filename" == "$PKGNAME-"*"-linux-x86_64" ]]; then
              output="${filename%-linux-x86_64}"
              install -m 0755 "$WORK/$filename" \
                "$ROOT/usr/bin/$output"

            elif [[ "$filename" == "$PKGNAME."*".default" ]]; then
              output="${filename%.default}"
              install -m 0644 "$WORK/$filename" \
                "$ROOT/etc/$PKGNAME/$output"
            fi
          done < "$WORK/assets.tsv"

          PKGBUILDDATE="$(date +%s)"
          DESC="$(cat "$RUNNER_TEMP/package-desc")"
          INSTALL_SIZE="$(du -sb "$ROOT" | cut -f1)"

          cat > "$ROOT/.PKGINFO" <<EOF
          pkgname = $PKGNAME
          pkgbase = $PKGNAME
          pkgver = $PKGVER-1
          pkgdesc = $DESC
          builddate = $PKGBUILDDATE
          packager = voidctx <packages@voidctx.dev>
          size = $INSTALL_SIZE
          arch = x86_64
          license = unknown
          EOF

          PKGFILE="$WORK/$PKGNAME.pkg.tar.zst"

          tar --zstd -cf "$PKGFILE" \
            --sort=name \
            --owner=0 --group=0 --numeric-owner \
            -C "$ROOT" \
            .PKGINFO usr etc

          tar --zstd -tf "$PKGFILE" | grep -Fx '.PKGINFO'
          tar --zstd -xOf "$PKGFILE" .PKGINFO

          echo "PKGFILE=$PKGFILE" >> "$GITHUB_ENV"
          echo "PKGBUILDDATE=$PKGBUILDDATE" >> "$GITHUB_ENV"

      - name: Sign package
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          # The imported private key is unencrypted.
          # GPG_PASSPHRASE was used only to decrypt privkey.asc.gpg.
          gpg --batch --yes \
            --local-user "$GPG_KEY_ID" \
            --detach-sign \
            --output "$PKGFILE.sig" \
            "$PKGFILE"

      - name: Download current repository database
        shell: bash
        run: |
          set -euo pipefail

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto

          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          WORK="$RUNNER_TEMP/package-work"
          mkdir -p "$WORK/repo"

          DBKEY="x86_64/voidctx.db.tar.gz"

          if aws --endpoint-url "$ENDPOINT" s3api head-object \
              --bucket "$R2_BUCKET" --key "$DBKEY" >/dev/null 2>&1; then
            aws --endpoint-url "$ENDPOINT" s3 cp \
              "s3://$R2_BUCKET/$DBKEY" \
              "$WORK/repo/voidctx.db.tar.gz"
          else
            python3 - "$WORK/repo/voidctx.db.tar.gz" <<'PY'
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "w:gz"):
              pass
          PY
          fi

      - name: Update repository database
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/package-work"
          REPO="$WORK/repo"
          PKGFILE="$WORK/$PKGNAME.pkg.tar.zst"

          cp "$PKGFILE" "$REPO/$PKGNAME.pkg.tar.zst"
          cp "$PKGFILE.sig" "$REPO/$PKGNAME.pkg.tar.zst.sig"

          python3 - <<'PY'
          import hashlib
          import io
          import os
          import subprocess
          import tarfile
          import time

          work = os.environ["RUNNER_TEMP"] + "/package-work"
          repo = work + "/repo"
          name = os.environ["PKGNAME"]
          version = os.environ["PKGVER"] + "-1"
          desc = open(
              os.environ["RUNNER_TEMP"] + "/package-desc",
              encoding="utf-8"
          ).read().strip()

          pkg_path = repo + "/" + name + ".pkg.tar.zst"
          db_path = repo + "/voidctx.db.tar.gz"

          digest = hashlib.sha256()
          compressed_size = 0

          with open(pkg_path, "rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  digest.update(chunk)
                  compressed_size += len(chunk)

          checksum = digest.hexdigest()

          # Read package entries without extracting arbitrary paths.
          proc = subprocess.Popen(
              ["zstd", "-dc", pkg_path],
              stdout=subprocess.PIPE
          )

          paths = []
          installed_size = 0

          try:
              with tarfile.open(fileobj=proc.stdout, mode="r|") as package:
                  for member in package:
                      path = member.name
                      if path.startswith("./"):
                          path = path[2:]
                      path = path.rstrip("/")

                      if not path or path == ".PKGINFO":
                          continue

                      if path.startswith("/") or ".." in path.split("/"):
                          raise SystemExit(f"Unsafe package path: {path}")

                      paths.append(path)

                      if member.isfile() and path != ".MTREE":
                          installed_size += member.size
          finally:
              if proc.stdout:
                  proc.stdout.close()

          if proc.wait() != 0:
              raise SystemExit("Failed to decompress package archive")

          if not paths:
              raise SystemExit("Package contains no installable files")

          builddate = int(os.environ["PKGBUILDDATE"])
          package_dir = f"{name}-{version}"

          desc_text = (
              f"%FILENAME%\n{name}.pkg.tar.zst\n\n"
              f"%NAME%\n{name}\n\n"
              f"%BASE%\n{name}\n\n"
              f"%VERSION%\n{version}\n\n"
              f"%DESC%\n{desc}\n\n"
              f"%CSIZE%\n{compressed_size}\n\n"
              f"%ISIZE%\n{installed_size}\n\n"
              f"%SHA256SUM%\n{checksum}\n\n"
              f"%ARCH%\nx86_64\n\n"
              f"%BUILDDATE%\n{builddate}\n\n"
              f"%PACKAGER%\nvoidctx <packages@voidctx.dev>\n\n"
              f"%LICENSE%\nunknown\n"
          ).encode()

          files_text = (
              "%FILES%\n" + "\n".join(sorted(set(paths))) + "\n"
          ).encode()

          # Identify all existing database directories for this package.
          old_members = []
          target_dirs = set()

          with tarfile.open(db_path, "r:gz") as old:
              for member in old.getmembers():
                  if not member.isfile():
                      continue

                  data = old.extractfile(member).read()

                  if member.name.endswith("/desc"):
                      text = data.decode(errors="replace")
                      if f"%NAME%\n{name}\n" in text:
                          target_dirs.add(member.name.rsplit("/", 1)[0])

                  old_members.append((member, data))

          # Replace the target package entry; preserve every other package.
          with tarfile.open(db_path, "w:gz") as new:
              for member, data in old_members:
                  parent = member.name.rsplit("/", 1)[0]
                  if parent in target_dirs:
                      continue

                  info = tarfile.TarInfo(member.name)
                  info.size = len(data)
                  info.mode = member.mode
                  info.mtime = member.mtime
                  info.type = tarfile.REGTYPE
                  new.addfile(info, io.BytesIO(data))

              for filename, data in (
                  (package_dir + "/desc", desc_text),
                  (package_dir + "/files", files_text),
              ):
                  info = tarfile.TarInfo(filename)
                  info.size = len(data)
                  info.mode = 0o644
                  info.mtime = builddate
                  info.type = tarfile.REGTYPE
                  new.addfile(info, io.BytesIO(data))

          # Pacman supports both database filenames.
          with open(db_path, "rb") as src:
              data = src.read()

          with open(repo + "/voidctx.db", "wb") as dst:
              dst.write(data)
          PY

      - name: Verify package checksum in database
        shell: bash
        run: |
          set -euo pipefail

          REPO="$RUNNER_TEMP/package-work/repo"
          EXPECTED="$(sha256sum "$REPO/$PKGNAME.pkg.tar.zst" | awk '{print $1}')"

          ACTUAL="$(
            python3 - "$REPO/voidctx.db.tar.gz" "$PKGNAME" <<'PY'
          import sys
          import tarfile

          db_path, wanted = sys.argv[1:]

          with tarfile.open(db_path, "r:gz") as db:
              for member in db.getmembers():
                  if not member.isfile() or not member.name.endswith("/desc"):
                      continue

                  content = db.extractfile(member).read().decode()
                  fields = content.splitlines()
                  name = checksum = None

                  for i, field in enumerate(fields[:-1]):
                      if field == "%NAME%":
                          name = fields[i + 1]
                      elif field == "%SHA256SUM%":
                          checksum = fields[i + 1]

                  if name == wanted:
                      if not checksum:
                          sys.exit("Missing SHA256SUM in package database entry")
                      print(checksum)
                      break
              else:
                  sys.exit(f"Package {wanted} not found in database")
          PY
          )"
          echo "Local package SHA256: $EXPECTED"
          echo "Database entry SHA256: $ACTUAL"
          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo "::error::Local package checksum does not match database entry"
            exit 1
          fi
          echo "Checksum verification passed."

      - name: Sign database files
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          REPO="$RUNNER_TEMP/package-work/repo"

          # Use the same imported, unencrypted private key as package signing.
          for file in "$REPO/voidctx.db.tar.gz" "$REPO/voidctx.db"; do
            gpg --batch --yes \
              --local-user "$GPG_KEY_ID" \
              --detach-sign \
              --output "$file.sig" \
              "$file"
          done

      - name: Publish package and database to R2
        shell: bash
        run: |
          set -euo pipefail

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto

          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          REPO="$RUNNER_TEMP/package-work/repo"

          upload() {
            local file="$1"
            local key="$2"
            local type="$3"

            aws --endpoint-url "$ENDPOINT" s3 cp \
              "$file" "s3://$R2_BUCKET/$key" \
              --content-type "$type"
          }

          # Publish the package before making the new database visible.
          upload "$REPO/$PKGNAME.pkg.tar.zst" \
            "x86_64/$PKGNAME.pkg.tar.zst" \
            "application/zstd"

          upload "$REPO/$PKGNAME.pkg.tar.zst.sig" \
            "x86_64/$PKGNAME.pkg.tar.zst.sig" \
            "application/pgp-signature"

          upload "$REPO/voidctx.db.tar.gz" \
            "x86_64/voidctx.db.tar.gz" \
            "application/gzip"

          upload "$REPO/voidctx.db.tar.gz.sig" \
            "x86_64/voidctx.db.tar.gz.sig" \
            "application/pgp-signature"

          upload "$REPO/voidctx.db" \
            "x86_64/voidctx.db" \
            "application/gzip"

          upload "$REPO/voidctx.db.sig" \
            "x86_64/voidctx.db.sig" \
            "application/pgp-signature"

          echo "Published $PKGNAME $PKGVER"
